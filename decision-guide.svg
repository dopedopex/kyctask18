<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
<title id="t">Do I need Redbelly KYC?</title>
<desc id="d">Exchange RBNT and wrapped RBNT on other chains: not needed. Bridging onto mainnet, sending, bridging off and staking on Redbelly mainnet: needed.</desc>
<rect width="1200" height="760" fill="#fbfaf8"/>
<text x="50" y="70" font-family="Georgia,serif" font-size="40" font-weight="700" fill="#1c1b20">Do I need Redbelly KYC?</text>
<text x="50" y="108" font-family="Arial,sans-serif" font-size="21" fill="#5b5a63">KYC here means Redbelly Access, with identity checks by Averer. It lets a wallet send transactions on Redbelly mainnet.</text>

<text x="50" y="165" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1c1b20">Off Redbelly mainnet</text>
<g font-family="Arial,sans-serif" font-size="23">
<rect x="50" y="180" width="1100" height="64" rx="6" fill="#fff" stroke="#dedbd5"/>
<text x="70" y="220" fill="#1c1b20">Buy, hold or trade RBNT on an exchange</text>
<rect x="900" y="196" width="230" height="34" rx="6" fill="#e6f3ec" stroke="#1c6b45"/><text x="1015" y="220" text-anchor="middle" font-weight="700" fill="#1c6b45">Not needed</text>
<rect x="50" y="254" width="1100" height="64" rx="6" fill="#fff" stroke="#dedbd5"/>
<text x="70" y="294" fill="#1c1b20">Hold, send or swap wrapped or bridged RBNT on another chain</text>
<rect x="900" y="270" width="230" height="34" rx="6" fill="#e6f3ec" stroke="#1c6b45"/><text x="1015" y="294" text-anchor="middle" font-weight="700" fill="#1c6b45">Not needed</text>
</g>

<text x="50" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#1c1b20">On Redbelly mainnet</text>
<g font-family="Arial,sans-serif" font-size="23">
<rect x="50" y="390" width="1100" height="64" rx="6" fill="#fff" stroke="#dedbd5"/>
<text x="70" y="430" fill="#1c1b20">Bridge RBNT onto Redbelly mainnet (verify first, then bridge)</text>
<rect x="900" y="406" width="230" height="34" rx="6" fill="#fbe9ec" stroke="#b50f2b"/><text x="1015" y="430" text-anchor="middle" font-weight="700" fill="#b50f2b">Needed</text>
<rect x="50" y="464" width="1100" height="64" rx="6" fill="#fff" stroke="#dedbd5"/>
<text x="70" y="504" fill="#1c1b20">Send, swap or use apps</text>
<rect x="900" y="480" width="230" height="34" rx="6" fill="#fbe9ec" stroke="#b50f2b"/><text x="1015" y="504" text-anchor="middle" font-weight="700" fill="#b50f2b">Needed</text>
<rect x="50" y="538" width="1100" height="64" rx="6" fill="#fff" stroke="#dedbd5"/>
<text x="70" y="578" fill="#1c1b20">Bridge RBNT off Redbelly mainnet</text>
<rect x="900" y="554" width="230" height="34" rx="6" fill="#fbe9ec" stroke="#b50f2b"/><text x="1015" y="578" text-anchor="middle" font-weight="700" fill="#b50f2b">Needed</text>
<rect x="50" y="612" width="1100" height="64" rx="6" fill="#fff" stroke="#dedbd5"/>
<text x="70" y="652" fill="#1c1b20">Stake RBNT on Redbelly mainnet</text>
<rect x="900" y="628" width="230" height="34" rx="6" fill="#fbe9ec" stroke="#b50f2b"/><text x="1015" y="652" text-anchor="middle" font-weight="700" fill="#b50f2b">Needed</text>
</g>
<text x="50" y="712" font-family="Arial,sans-serif" font-size="19" fill="#5b5a63">Needed: verify and enable your wallet at access.redbelly.network.</text>
<text x="50" y="738" font-family="Arial,sans-serif" font-size="19" fill="#5b5a63">Approval usually takes a few minutes, rarely a few days. Up to 10 wallets per identity. Guide: pykyc.vercel.app</text>
</svg>
